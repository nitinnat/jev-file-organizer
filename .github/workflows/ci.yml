name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Install project
        run: poetry install --with dev --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest

      - name: Build distributions
        run: poetry build

      - name: Install release checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: poetry run python -m pip install bandit pip-audit twine

      - name: Run security checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          poetry run bandit -q -r src
          poetry run pip-audit

      - name: Check package metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: poetry run twine check dist/*

      - name: Smoke-test the wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m venv /tmp/jfo-smoke
          /tmp/jfo-smoke/bin/python -m pip install dist/*.whl
          /tmp/jfo-smoke/bin/jfo --version
          /tmp/jfo-smoke/bin/jfo --help
